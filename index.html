<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stuex Flashcard Game</title>
    <!-- Include SheetJS for Excel processing and FileSaver for export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --border-color: #333333;
            --hover-border: #555555;
            --green-color: #00C853;
            --red-color: #D50000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }

        /* App Container */
        #app {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header Hierarchy */
        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        header .small-title {
            font-size: 14px;
            color: #888888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        header .big-title {
            font-size: 42px;
            font-weight: bold;
            margin: 5px 0;
            letter-spacing: 2px;
        }
        header .author {
            font-size: 13px;
            color: #888888;
        }

        /* Main Menu Layout */
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .card-box {
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            background-color: var(--bg-color);
        }

        .import-section {
            text-align: center;
            border: 2px dashed var(--border-color);
            padding: 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .import-section:hover {
            border-color: var(--hover-border);
        }
        .import-section input[type="file"] {
            display: none;
        }

        /* Controls / Toggles */
        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .control-group select {
            background: #111;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--green-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Revmast Link Box */
        .revmast-box {
            text-align: center;
        }
        .revmast-box a {
            color: #4da6ff;
            text-decoration: none;
            word-break: break-all;
        }
        .revmast-box a:hover { text-decoration: underline; }

        /* Buttons */
        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { background: #111; border-color: var(--hover-border); }
        .btn-primary { background: #fff; color: #000; border-color: #fff; }
        .btn-primary:hover { background: #e0e0e0; }

        /* Game Page Layout */
        #game-page {
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
        }

        /* Clean Non-Overlapping Game Header Bar */
        .game-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .game-settings-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: border-color 0.2s;
        }
        .game-settings-btn:hover { border-color: var(--hover-border); }

        #progress-indicator {
            font-size: 14px;
            color: #ccc;
            font-weight: bold;
        }

        #timer-display {
            color: #ff5252;
            font-weight: bold;
            font-size: 14px;
        }

        /* 3D Flashcard Container & Flip Animations */
        .flashcard-scene {
            perspective: 1200px;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .flashcard-card {
            width: 100%;
            height: 100%;
            min-height: 48vh;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #050505;
            cursor: pointer;
        }

        .flashcard-card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            overflow-y: auto;
            word-break: break-word;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .flashcard-content {
            font-size: 24px;
            line-height: 1.5;
            max-width: 100%;
        }
        .flashcard-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px auto;
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }

        /* Card Change Slide & Fade Animation */
        .animate-card-change {
            animation: cardFadeIn 0.35s ease-out;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: scale(0.97) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Bottom Controls (Big Symbols, No Images) */
        .game-bottom-controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .circle-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: #111;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 32px;
            font-weight: bold;
            transition: transform 0.15s, background 0.2s, border-color 0.2s;
            position: relative;
        }
        .circle-btn:hover { background: #222; border-color: var(--hover-border); transform: scale(1.08); }
        .circle-btn.green { color: var(--green-color); border-color: rgba(0,200,83,0.5); }
        .circle-btn.red { color: var(--red-color); border-color: rgba(213,0,0,0.5); }

        /* Floating Feedback Bubbles */
        .floating-bubble {
            position: absolute;
            bottom: 100px;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }
        .floating-bubble.green { background: var(--green-color); color: #000; }
        .floating-bubble.red { background: var(--red-color); color: #fff; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
        }

        /* Fullscreen Image Overlay */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #fullscreen-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .close-fullscreen {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 36px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal-content {
            background: #111;
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .modal-content h3 { font-size: 20px; margin-bottom: 5px; }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* How to play styles */
        .howto-step {
            line-height: 1.5;
            font-size: 14px;
            color: #ccc;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            header .big-title { font-size: 32px; }
            .circle-btn { width: 60px; height: 60px; font-size: 26px; }
            .game-bottom-controls { gap: 15px; }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- MAIN MENU PAGE -->
        <div id="main-menu-page" class="main-menu">
            <header>
                <div class="small-title">Stuex</div>
                <div class="big-title">Flashcard</div>
                <div class="author">By Pankaj Mehra</div>
            </header>

            <div class="import-section" onclick="document.getElementById('file-input').click()">
                <div style="font-size: 32px; margin-bottom: 10px;">📁</div>
                <div style="font-weight: bold; margin-bottom: 5px;">Import Excel or Google Sheet File</div>
                <div style="font-size: 12px; color: #888;">Supports .xlsx files (Columns A & B)</div>
                <input type="file" id="file-input" accept=".xlsx, .xls, .csv" onchange="handleFileImport(event)">
            </div>

            <div class="card-box flex flex-col gap-2">
                <div class="control-group">
                    <span>Timer Toggle</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <select id="timer-duration" onchange="updateTimerSetting()">
                            <option value="10">10s</option>
                            <option value="20">20s</option>
                            <option value="30" selected>30s</option>
                            <option value="40">40s</option>
                            <option value="50">50s</option>
                            <option value="60">60s</option>
                            <option value="70">70s</option>
                            <option value="80">80s</option>
                            <option value="90">90s</option>
                            <option value="100">100s</option>
                            <option value="110">110s</option>
                            <option value="120">120s</option>
                        </select>
                        <label class="switch">
                            <input type="checkbox" id="timer-toggle" onchange="toggleTimerSetting()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-group" style="margin-top: 15px;">
                    <span>Randomize Cards</span>
                    <label class="switch">
                        <input type="checkbox" id="randomize-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="card-box revmast-box">
                <div style="font-weight: bold; margin-bottom: 8px; color: #aaa; font-size: 14px;">revmast</div>
                <a href="https://stuex.github.io/Revmast/" target="_blank">https://stuex.github.io/Revmast/</a>
            </div>

            <button class="btn btn-primary" onclick="openHowToPlay()">How to Play</button>
            <button class="btn" onclick="loadDemoCards()">Load Demo Flashcards</button>
        </div>

        <!-- GAME PAGE -->
        <div id="game-page" class="hidden">
            <!-- Non-overlapping Game Header Bar -->
            <div class="game-header-bar">
                <button class="game-settings-btn" onclick="openSettingsModal()">⚙ Settings</button>
                <div id="progress-indicator">Flashcard 1 out of 10</div>
                <div id="timer-display" class="hidden">Time: 30s</div>
            </div>

            <!-- 3D Flashcard Scene -->
            <div class="flashcard-scene" id="flashcard-box" tabindex="0">
                <div class="flashcard-card animate-card-change" id="flashcard-card-elem" onclick="flipCard()">
                    <div class="card-face card-front">
                        <div class="flashcard-content" id="card-front-content">Front Content</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="flashcard-content" id="card-back-content">Back Content</div>
                    </div>
                </div>
            </div>

            <!-- Big Circular Control Symbols (No Images) -->
            <div class="game-bottom-controls">
                <button class="circle-btn green" onclick="markCard(true)" title="Correct (Right Arrow / Swipe Left)">
                    ✔
                </button>
                <button class="circle-btn red" onclick="markCard(false)" title="Wrong (Left Arrow / Swipe Right)">
                    ✖
                </button>
                <button class="circle-btn" onclick="undoCard()" title="Undo (Right Shift)">
                    ↩
                </button>
                <button class="circle-btn" onclick="flipCard()" title="Flip Card (Enter)">
                    ↻
                </button>
            </div>
        </div>
    </div>

    <!-- MODALS & OVERLAYS -->
    <div id="modal-container"></div>

    <script>
        // App State
        let flashcards = [];
        let currentIndex = 0;
        let isShowingBack = false;
        let historyStack = [];
        let wrongCardsMap = {};
        let originalFileName = "Stuex_Flashcards";
        
        // Timer & Settings
        let timerEnabled = false;
        let timerDuration = 30;
        let timerInterval = null;
        let timeLeft = 30;
        let randomizeEnabled = true;

        // Image Zoom State
        let currentZoom = 1;
        let panX = 0;
        let panY = 0;

        // Touch swipe gestures
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        const sceneBox = document.getElementById('flashcard-box');
        sceneBox.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        sceneBox.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleGesture();
        }, {passive: true});

        function handleGesture() {
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                if (diffX < 0) markCard(true);  // Swipe Left -> Correct
                else markCard(false);           // Swipe Right -> Wrong
            }
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('game-page').classList.contains('hidden')) return;

            if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Enter', 'ShiftRight', 'ShiftLeft'].includes(e.key)) {
                if (!e.ctrlKey) e.preventDefault();
            }

            if (e.ctrlKey && e.key === '=') {
                e.preventDefault();
                zoomImage(0.2);
            } else if (e.ctrlKey && e.key === '-') {
                e.preventDefault();
                zoomImage(-0.2);
            } else if (!e.ctrlKey) {
                if (e.key === 'ArrowRight') markCard(true);
                else if (e.key === 'ArrowLeft') markCard(false);
                else if (e.key === 'ShiftRight' || e.key === 'ShiftLeft') undoCard();
                else if (e.key === 'Enter') {
                    const fs = document.getElementById('fullscreen-overlay');
                    if (fs) closeFullscreen();
                    else flipCard();
                }
            }
        });

        function loadDemoCards() {
            originalFileName = "Demo_Flashcards.xlsx";
            flashcards = [
                { front: "<b>What is Stuex?</b><br>A modern flashcard web application.", back: "Optimized for mobile and PC with 3D flip animations and custom formatting.", sheetName: "Sheet1" },
                { front: "What shortcut marks a card correct?", back: "Right Arrow (or Swipe Left).", sheetName: "Sheet1" },
                { front: "What shortcut flips a flashcard?", back: "The Enter key or clicking the card.", sheetName: "Sheet1" },
                { front: "How are columns mapped in Excel?", back: "Column A is Front, Column B is Back.", sheetName: "Sheet2" },
                { front: "What is the background theme of Stuex?", back: "Pure black (#000000) with white UI text.", sheetName: "Sheet2" }
            ];
            startGame();
        }

        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            originalFileName = file.name;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellStyles: true, cellHTML: true });
                    
                    flashcards = [];
                    wrongCardsMap = {};

                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        rows.forEach((row, rowIndex) => {
                            let frontVal = row[0];
                            let backVal = row[1];

                            if (frontVal !== undefined && frontVal !== null && String(frontVal).trim() !== "") {
                                flashcards.push({
                                    front: String(frontVal),
                                    back: backVal !== undefined && backVal !== null ? String(backVal) : "(No Back Content)",
                                    sheetName: sheetName,
                                    originalIndex: rowIndex
                                });
                            }
                        });
                    });

                    if (flashcards.length === 0) {
                        alert("No valid flashcards found in Columns A and B.");
                        return;
                    }

                    startGame();
                } catch (err) {
                    console.error(err);
                    alert("Error parsing file.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function startGame() {
            randomizeEnabled = document.getElementById('randomize-toggle').checked;
            if (randomizeEnabled) {
                for (let i = flashcards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
                }
            }

            currentIndex = 0;
            isShowingBack = false;
            historyStack = [];
            wrongCardsMap = {};

            document.getElementById('main-menu-page').classList.add('hidden');
            document.getElementById('game-page').classList.remove('hidden');

            renderCard();
            setupTimer();
        }

        function renderCard() {
            if (currentIndex >= flashcards.length) {
                finishGame();
                return;
            }

            const card = flashcards[currentIndex];
            document.getElementById('card-front-content').innerHTML = card.front;
            document.getElementById('card-back-content').innerHTML = card.back;

            // Reset 3D flip state
            isShowingBack = false;
            const cardElem = document.getElementById('flashcard-card-elem');
            cardElem.classList.remove('is-flipped');

            // Trigger smooth change animation
            cardElem.classList.remove('animate-card-change');
            void cardElem.offsetWidth;
            cardElem.classList.add('animate-card-change');

            // Update Progress & Sheet notification
            const prog = document.getElementById('progress-indicator');
            if (currentIndex === 0 || flashcards[currentIndex - 1].sheetName !== card.sheetName) {
                prog.textContent = `📁 Sheet: ${card.sheetName} (${currentIndex + 1}/${flashcards.length})`;
            } else {
                prog.textContent = `Flashcard ${currentIndex + 1} out of ${flashcards.length}`;
            }

            currentZoom = 1;
            sceneBox.focus();
        }

        function flipCard() {
            isShowingBack = !isShowingBack;
            const cardElem = document.getElementById('flashcard-card-elem');
            cardElem.classList.toggle('is-flipped', isShowingBack);
        }

        function markCard(isCorrect) {
            const currentCard = flashcards[currentIndex];
            
            historyStack.push({
                index: currentIndex,
                isShowingBack: isShowingBack,
                card: currentCard,
                wasWrong: !isCorrect
            });

            if (!isCorrect) {
                if (!wrongCardsMap[currentCard.sheetName]) wrongCardsMap[currentCard.sheetName] = [];
                wrongCardsMap[currentCard.sheetName] = wrongCardsMap[currentCard.sheetName].filter(c => c.originalIndex !== currentCard.originalIndex);
                wrongCardsMap[currentCard.sheetName].push(currentCard);
                showFloatingBubble("✖ Wrong", "red");
            } else {
                if (wrongCardsMap[currentCard.sheetName]) {
                    wrongCardsMap[currentCard.sheetName] = wrongCardsMap[currentCard.sheetName].filter(c => c.originalIndex !== currentCard.originalIndex);
                }
                showFloatingBubble("✔ Correct", "green");
            }

            currentIndex++;
            renderCard();
            resetTimer();
        }

        function undoCard() {
            if (historyStack.length === 0) {
                showFloatingBubble("Nothing to undo", "#555");
                return;
            }
            const lastAction = historyStack.pop();
            currentIndex = lastAction.index;
            isShowingBack = lastAction.isShowingBack;

            if (lastAction.wasWrong && wrongCardsMap[lastAction.card.sheetName]) {
                wrongCardsMap[lastAction.card.sheetName] = wrongCardsMap[lastAction.card.sheetName].filter(c => c.originalIndex !== lastAction.card.originalIndex);
            }

            renderCard();
            const cardElem = document.getElementById('flashcard-card-elem');
            if (isShowingBack) cardElem.classList.add('is-flipped');
            else cardElem.classList.remove('is-flipped');

            showFloatingBubble("↩ Undone", "#555");
            resetTimer();
        }

        function showFloatingBubble(text, type) {
            const bubble = document.createElement('div');
            bubble.className = `floating-bubble ${type === 'red' ? 'red' : 'green'}`;
            if (type === '#555') bubble.style.background = '#444';
            bubble.textContent = text;
            sceneBox.appendChild(bubble);
            setTimeout(() => bubble.remove(), 1000);
        }

        /* Timer Management */
        function setupTimer() {
            timerEnabled = document.getElementById('timer-toggle').checked;
            const timerDisp = document.getElementById('timer-display');
            if (!timerEnabled) {
                timerDisp.classList.add('hidden');
                clearInterval(timerInterval);
                return;
            }
            timerDuration = parseInt(document.getElementById('timer-duration').value) || 30;
            resetTimer();
        }

        function toggleTimerSetting() { setupTimer(); }
        function updateTimerSetting() { if (document.getElementById('timer-toggle').checked) setupTimer(); }

        function resetTimer() {
            if (!timerEnabled) return;
            clearInterval(timerInterval);
            timeLeft = timerDuration;
            const timerDisp = document.getElementById('timer-display');
            timerDisp.classList.remove('hidden');
            timerDisp.textContent = `Time: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisp.textContent = `Time: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    markCard(false);
                }
            }, 1000);
        }

        /* Image Zoom & Fullscreen */
        function zoomImage(delta) {
            currentZoom = Math.max(0.5, Math.min(3, currentZoom + delta));
            const img = sceneBox.querySelector('.card-face img');
            if (img) img.style.transform = `scale(${currentZoom})`;
        }

        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'IMG' && e.target.closest('#flashcard-box')) {
                openFullscreen(e.target.src);
            }
        });

        function openFullscreen(src) {
            const overlay = document.createElement('div');
            overlay.id = 'fullscreen-overlay';
            overlay.innerHTML = `
                <button class="close-fullscreen" onclick="closeFullscreen()">×</button>
                <img src="${src}" alt="Fullscreen Image">
            `;
            document.body.appendChild(overlay);
        }

        function closeFullscreen() {
            const overlay = document.getElementById('fullscreen-overlay');
            if (overlay) overlay.remove();
        }

        /* Settings Modal */
        function openSettingsModal() {
            clearInterval(timerInterval);
            document.getElementById('modal-container').innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-content">
                        <h3>Settings</h3>
                        <button class="btn" onclick="closeModal(); quitGame();">Quit Game</button>
                        <button class="btn" onclick="closeModal(); exportWrongExcel();">Get Excel for Red Button Tapped Cards</button>
                        <div class="modal-buttons" style="margin-top: 10px;">
                            <button class="btn btn-primary" onclick="closeModal(); resumeGame();">Resume Game</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
        function resumeGame() { if (timerEnabled) resetTimer(); sceneBox.focus(); }

        function quitGame() {
            clearInterval(timerInterval);
            document.getElementById('game-page').classList.add('hidden');
            document.getElementById('main-menu-page').classList.remove('hidden');
        }

        function finishGame() {
            clearInterval(timerInterval);
            const totalWrong = Object.values(wrongCardsMap).reduce((acc, sheet) => acc + sheet.length, 0);

            document.getElementById('modal-container').innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-content">
                        <h3>Game Completed!</h3>
                        <p style="color: #ccc; font-size: 14px;">Total wrong answers marked: ${totalWrong}</p>
                        <p style="font-weight: bold; margin-top: 10px;">Do you want to get excel for wrong answers?</p>
                        <div class="modal-buttons" style="margin-top: 15px;">
                            <button class="btn" onclick="closeModal(); quitGame();">No</button>
                            <button class="btn btn-primary" onclick="closeModal(); exportWrongExcel(); quitGame();">Yes, Export Excel</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportWrongExcel() {
            const hasWrong = Object.values(wrongCardsMap).some(sheet => sheet.length > 0);
            if (!hasWrong) {
                alert("No wrong answers recorded to export!");
                return;
            }

            const wb = XLSX.utils.book_new();
            for (const [sheetName, cards] of Object.entries(wrongCardsMap)) {
                if (cards.length === 0) continue;
                const wsData = cards.map(c => [c.front, c.back]);
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            }

            XLSX.writeFile(wb, `wrong_${originalFileName.replace(/\.[^/.]+$/, "")}.xlsx`);
        }

        function openHowToPlay() {
            document.getElementById('modal-container').innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-content" style="max-width: 550px; max-height: 85vh; overflow-y: auto;">
                        <h3>How to Play Stuex</h3>
                        <div class="howto-step"><b>1. Importing:</b> Upload any Excel file (.xlsx) or use demo cards. Columns A & B are parsed.</div>
                        <div class="howto-step"><b>2. Correct Answer:</b> Tap the green <b>✔</b> button, swipe left, or press the <b>Right Arrow</b>.</div>
                        <div class="howto-step"><b>3. Wrong Answer:</b> Tap the red <b>✖</b> button, swipe right, or press the <b>Left Arrow</b>.</div>
                        <div class="howto-step"><b>4. Flip Card:</b> Tap the card itself, click <b>↻</b>, or press <b>Enter</b> for 3D flip animation.</div>
                        <div class="howto-step"><b>5. Undo:</b> Tap <b>↩</b> or press <b>Right Shift</b>.</div>
                        <div class="howto-step"><b>6. Settings & Export:</b> Access settings anytime from the top bar to quit or download your wrong answers workbook.</div>
                        <div class="modal-buttons" style="margin-top: 15px;">
                            <button class="btn btn-primary" onclick="closeModal()">Got it!</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
