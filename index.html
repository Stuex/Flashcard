<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stuex Flashcard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:#fff;cursor:pointer}
.pg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.pg.on{display:flex}
header{text-align:center;margin-bottom:28px}
header small{display:block;font-size:15px;color:#bbb;letter-spacing:.04em}
header h1{margin:2px 0;font-size:clamp(44px,12vw,72px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#d9578f,#d9a02b,#3ea66b,#4a8fe7);-webkit-background-clip:text;background-clip:text;color:transparent}
.menu{width:min(92vw,420px);display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid #333;border-radius:20px;background:#000;font-size:18px;cursor:pointer;text-align:left}
.row>span:nth-child(2){flex:1}
.dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#000;border:2px solid var(--a)}
.dot svg,.ic svg,#fx svg{width:24px;height:24px;fill:none;stroke:var(--a);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
select{background:#000;color:#fff;border:1px solid #333;border-radius:12px;padding:6px 8px;font-size:15px}
select:disabled{opacity:.35}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;background:#333;border-radius:30px;transition:.3s}
.sw i:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.3s}
.sw input:checked+i{background:#3ea66b}
.sw input:checked+i:before{transform:translateX(22px)}
.top{position:relative;width:min(94vw,720px);height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.ic{--a:#8b6fdc;position:absolute;left:0;width:40px;height:40px;border-radius:50%;border:2px solid var(--a);background:#000;display:grid;place-items:center}
#cnt{font-size:14px;color:#ddd}
#cnt.fl{animation:bl .5s 4}
@keyframes bl{50%{opacity:.1}}
#tm{position:absolute;right:4px;font-size:16px;color:#d9a02b}
.pop{position:absolute;left:0;top:46px;z-index:20;display:none;flex-direction:column;background:#0b0b0b;border:1px solid #333;border-radius:16px;padding:6px;min-width:260px}
.pop.on{display:flex}
.pop button{background:none;border:0;padding:12px 14px;text-align:left;font-size:15px;border-radius:10px}
.pop button:hover{background:#1a1a1a}
#stage{position:relative;width:min(94vw,720px);height:min(650px,calc(100dvh - 190px));overflow:hidden}
.slot{position:absolute;inset:0;perspective:1400px}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #333;border-radius:24px;background:#000;overflow:hidden}
.bk{transform:rotateY(180deg)}
.card:not(.flip) .bk,.card.flip .fr{pointer-events:none}
.gf .face{animation:gf .5s}.rf .face{animation:rf .5s}
@keyframes gf{50%{border-color:#3ea66b}}
@keyframes rf{50%{border-color:#d9534f}}
.sc{height:100%;overflow-y:auto;display:flex;padding:22px;overscroll-behavior:contain;touch-action:none;scrollbar-width:thin;scrollbar-color:#333 #000}
.in{margin:auto;width:100%}
.tx{font-size:24px;line-height:1.35;white-space:pre-wrap;word-break:break-word;text-align:left}
.tx.one{text-align:center}
.io .tx{display:none}
.iw{display:grid;place-items:center;overflow:hidden;margin-top:12px;border-radius:10px}
.io .iw:first-child{margin-top:0}
.iw img{max-width:100%;max-height:min(380px,45dvh);object-fit:contain;transition:transform .15s;user-select:none;-webkit-user-drag:none}
.io .iw img{max-height:min(560px,calc(100dvh - 290px))}
#deck{display:flex;gap:clamp(14px,5vw,34px);margin-top:16px}
.cb{position:relative;width:64px;height:64px;border-radius:50%;border:2px solid var(--a);background:#000;display:grid;place-items:center;transition:transform .2s,opacity .2s}
.cb svg{width:30px;height:30px;fill:none;stroke:var(--a);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cb:active,.cb.pr{opacity:.65;transform:translateY(-6px) scale(1.08)}
.cb:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);opacity:0;pointer-events:none}
.cb.pr:after{animation:pf .5s}
@keyframes pf{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
#ttl{position:fixed;inset:0;display:none;place-items:center;z-index:40;background:#000d;font-size:clamp(28px,7vw,44px);font-weight:700;text-align:center;padding:24px;pointer-events:none}
#ttl.on{display:grid;animation:fo 1.4s forwards}
@keyframes fo{70%{opacity:1}to{opacity:0}}
#modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
.box{background:#0b0b0b;border:1px solid #333;border-radius:22px;padding:24px;max-width:460px;width:100%}
.box h2{margin:0 0 8px;font-size:22px}.box p{color:#ddd;line-height:1.5;margin:8px 0}
.nav{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn{border:1px solid #333;background:#111;border-radius:14px;padding:10px 18px;font-size:16px}
.btn.p{border:0;background:#3ea66b;color:#000;font-weight:700}
.demo{display:flex;gap:12px;justify-content:center;margin:14px 0}
.demo .cb{width:54px;height:54px}.demo .cb svg{width:26px;height:26px}
#fs{touch-action:none;position:fixed;inset:0;background:#000;z-index:60;display:none;place-items:center;overflow:hidden}
#fs.on{display:grid}
#fs img{max-width:100vw;max-height:100vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none}
#fx{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;--a:#d9534f;border:2px solid var(--a);background:#000;display:grid;place-items:center;z-index:2}
.mv{position:relative;width:100%;aspect-ratio:16/9;margin-top:12px;border-radius:10px;overflow:hidden;background:#000;border:1px solid #333;touch-action:auto}
.mv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transition:transform .15s}
#stage.fsl{position:fixed;inset:0;width:100%;height:100%;z-index:30;background:#000}
#stage.fsl .face{border-radius:0}
#game:focus{outline:none}
.cb,.ic,#fx,.dot{display:flex;align-items:center;justify-content:center;padding:0;line-height:0}
.cb svg,.ic svg,#fx svg,.dot svg{position:static;transform:none;display:block;flex:none;margin:0}
</style></head><body>

<div id="main" class="pg on">
  <header><small>Stuex</small><h1>Flashcard</h1><small>By Pankaj Mehra</small></header>
  <div class="menu">
    <label class="row" id="imp" style="--a:#3ea66b;--b:#4a8fe7"><span class="dot"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></span><span>Import File</span><input type="file" id="file" accept=".xlsx,.xls,.pdf" hidden></label>
    <div class="row" style="cursor:default"><span class="dot" style="--a:#d9a02b;--b:#d9578f"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/></svg></span><span>Timer</span>
      <select id="tsel" disabled></select><label class="sw"><input type="checkbox" id="tOn"><i></i></label></div>
    <div class="row" style="cursor:default"><span class="dot" style="--a:#8b6fdc;--b:#d9578f"><svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></span><span>Randomize</span><label class="sw"><input type="checkbox" id="rOn"><i></i></label></div>
    <button class="row" id="how" style="--a:#4a8fe7;--b:#8b6fdc"><span class="dot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></svg></span><span>How to Play</span></button>
  </div>
</div>

<div id="game" class="pg">
  <div class="top"><button class="ic" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button><div id="cnt"></div><div id="tm"></div>
    <div class="pop" id="pop"><button id="quit">Quit Game</button><button id="exp">Get Excel for Red Button Tapped Cards</button></div></div>
  <div id="stage"></div>
  <div id="deck"></div>
</div>
<div id="ttl"></div><div id="fs"><button id="fx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img alt=""></div><div id="modal"><div class="box"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const WURL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const IC={
 R:'<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>',
 W:'<svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>',
 U:'<svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>',
 F:'<svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8A5.87 5.87 0 0 1 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>'};
const COL={W:['#d9534f'],U:['#4a8fe7'],F:['#d9a02b'],R:['#3ea66b']};
const S=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
Object.assign(IC,{
 R:S('<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>'),
 W:S('<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>'),
 U:S('<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'),
 F:S('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>')});
[ '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  '<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
  '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>'
].forEach((p,n)=>$$('.menu .dot')[n].innerHTML=S(p));
$('#gear').innerHTML=S('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>');
$('#fx').innerHTML=S('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>');
const ORDER=['W','U','F','R'],NAME={W:'Wrong answer (red)',U:'Undo / previous card',F:'Flip card',R:'Right answer (green)'};
const btnHTML=(k,c='')=>`<button class="cb ${c}" data-k="${k}" style="--a:${COL[k][0]}" aria-label="${NAME[k]}">${IC[k]}</button>`;
$('#deck').innerHTML=ORDER.map(k=>btnHTML(k)).join('');
$('#tsel').innerHTML=[...Array(12)].map((_,n)=>`<option value="${(n+1)*10}">${(n+1)*10}s</option>`).join('');
$('#tOn').onchange=e=>$('#tsel').disabled=!e.target.checked;

let D=[],i=0,wrong=new Map(),fname='',busy=false,flipped=false,tInt,lastSheet=null,lastTap=0,zs={z:1,x:0,y:0};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const du=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const shuffle=a=>{for(let n=a.length-1;n>0;n--){const j=Math.random()*(n+1)|0;[a[n],a[j]]=[a[j],a[n]]}};
const show=id=>$$('.pg').forEach(p=>p.classList.toggle('on',p.id===id));

/* ---------- IMPORT ---------- */
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const n=f.name.toLowerCase(),lab=$('#imp span:nth-child(2)');lab.textContent='Reading…';
  try{
    if(n.endsWith('.xls'))throw Error('Legacy .xls is not supported by the Excel engine. Please re-save it as .xlsx and import again.');
    D=n.endsWith('.pdf')?await parsePdf(f):await parseXlsx(f);
    if(!D.length)throw Error('No flashcards were found in this file.');
    fname=f.name.replace(/\.[^.]+$/,'');
    if($('#rOn').checked)shuffle(D);
    wrong=new Map();lastSheet=null;i=0;show('game');render(0);
  }catch(err){alert(err.message||err)}finally{lab.textContent='Import File'}
};

const hex=a=>a&&a.length===8?'#'+a.slice(2):null;
const lum=x=>{const n=parseInt(x.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
function cellHTML(c){
  const v=c.value;if(v==null||v==='')return'';
  const ss=v.richText?v.richText.map(r=>[r.text,r.font||{}]):[[v instanceof Date?v.toLocaleDateString():String(typeof v==='object'?(v.result??v.text??''):v),c.font||{}]];
  let fl=c.fill&&c.fill.pattern==='solid'&&c.fill.fgColor?hex(c.fill.fgColor.argb):null;
  if(fl&&lum(fl)>.97)fl=null;
  return ss.map(([t,f])=>{
    let col=f.color&&hex(f.color.argb);
    if(fl&&!col)col=lum(fl)>.55?'#000':'#fff';
    if(col&&!fl&&lum(col)<.2)col=null;
    const st=(f.bold?'font-weight:700;':'')+(f.italic?'font-style:italic;':'')+(f.underline?'text-decoration:underline;':'')+(col?'color:'+col+';':'')+(fl?'background:'+fl+';padding:0 3px;border-radius:3px;':'');
    return`<span style="${st}">${esc(String(t)).replace(/\r?\n/g,'<br>')}</span>`;
  }).join('');
}
async function shrink(m){
  const ext=(m.extension||'png').replace('jpg','jpeg'),b=new Blob([m.buffer],{type:'image/'+ext}),bmp=await createImageBitmap(b);
  if(b.size<=350e3)return{u:await du(b),w:bmp.width,h:bmp.height};
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*s),h=Math.round(bmp.height*s),cv=document.createElement('canvas');
  cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
  let q=.92,o;do{o=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));q-=.08}while(o.size>350e3&&q>.5);
  return{u:await du(o),w,h};
}
async function parseXlsx(f){
  if(!window.ExcelJS)throw Error('Excel engine failed to load. Check your internet connection.');
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());const out=[];
  for(const ws of wb.worksheets){
    const im={};let mx=ws.rowCount;
    for(const g of ws.getImages()){const t=g.range.tl,r=Math.floor(t.nativeRow)+1,k=r+':'+Math.floor(t.nativeCol);mx=Math.max(mx,r);(im[k]=im[k]||[]).push(await shrink(wb.getImage(g.imageId)));}
    for(let r=1;r<=mx;r++){
      const sd=[0,1].map(c=>{const cell=ws.getCell(r,c+1);let v=null;try{v=cell.value==null?null:JSON.parse(JSON.stringify(cell.value))}catch(e){}
        return{h:cellHTML(cell),img:im[r+':'+c]||[],v,st:JSON.parse(JSON.stringify(cell.style||{})),u:(cell.value&&cell.value.hyperlink)||''}});
      if(sd.every(s=>!s.h&&!s.img.length))continue;
      out.push({s:ws.name,f:sd[0],b:sd[1]});
    }
  }
  return out;
}
const pinkY=(r,g,b)=>r>200&&g<r-40&&b>g+10?'f':r>200&&g>180&&b<g-60?'b':null;
async function parsePdf(f){
  if(!window.pdfjsLib)throw Error('PDF engine failed to load. Check your internet connection.');
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){const t=await(await fetch(WURL)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}))}
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,H=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p),tc=(await pg.getTextContent()).items.filter(t=>t.str),an=(await pg.getAnnotations()).filter(a=>a.subtype==='Highlight'&&a.color);
    for(const a of an){
      const k=pinkY(...a.color);if(!k)continue;
      const q=(a.quadPoints||[]).flat(),P=typeof q[0]==='number'?[...Array(q.length>>1)].map((_,j)=>({x:q[2*j],y:q[2*j+1]})):q,R=[];
      for(let j=0;j+3<P.length;j+=4){const s=P.slice(j,j+4);R.push([Math.min(...s.map(o=>o.x)),Math.min(...s.map(o=>o.y)),Math.max(...s.map(o=>o.x)),Math.max(...s.map(o=>o.y))])}
      if(!R.length)R.push(a.rect);
      let t='';
      for(const it of tc){
        const cy=it.transform[5]+(it.height||8)/2,L=it.str.length;
        const s=[...it.str].filter((_,j)=>{const x=it.transform[4]+(j+.5)*it.width/L;return R.some(r=>x>=r[0]-1&&x<=r[2]+1&&cy>=r[1]-2&&cy<=r[3]+2)}).join('');
        if(s)t+=(t?' ':'')+s.trim();
      }
      if(t)H.push({p,y:a.rect[3],x:a.rect[0],k,t});
    }
  }
  H.sort((a,b)=>a.p-b.p||b.y-a.y||a.x-b.x);
  const out=[];let fr=null;
  for(const h of H){if(h.k==='f')fr=h.t;else if(fr!=null){out.push({s:'',f:{h:esc(fr),img:[],v:fr,st:{}},b:{h:esc(h.t),img:[],v:h.t,st:{}}});fr=null}}
  return out;
}

/* ---------- GAME ---------- */
const plain=h=>h.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const tmv=v=>{if(!v)return 0;if(/^\d+$/.test(v))return+v;const m=/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i.exec(v);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0};
function ytp(u){let x;try{x=new URL(u)}catch(e){return null}
  const h=x.hostname.replace(/^(www|m)\./,''),P=x.pathname.split('/').filter(Boolean);let id=null;
  if(h==='youtu.be')id=P[0];else if(h==='youtube.com'||h==='youtube-nocookie.com'){if(P[0]==='watch')id=x.searchParams.get('v');else if(['embed','shorts','live','v'].includes(P[0]))id=P[1]}
  if(!id||!/^[\w-]{11}$/.test(id))return null;
  const g=k=>x.searchParams.get(k);return{id,s:tmv(g('start')||g('t')),e:tmv(g('end')||g('stop'))}}
function drv(u){let x;try{x=new URL(u)}catch(e){return null}
  if(!/(^|\.)drive\.google\.com$/.test(x.hostname))return null;
  const m=x.pathname.match(/\/file\/d\/([\w-]+)/),id=m?m[1]:x.searchParams.get('id');return id&&/^[\w-]+$/.test(id)?id:null}
function media(s){const L=[...(s.u?[s.u]:[]),...(plain(s.h).match(/https?:\/\/[^\s<>"']+/g)||[])],seen={},o=[];
  for(let u of L){u=u.replace(/[).,;]+$/,'');const y=ytp(u),d=!y&&drv(u),m=y?{k:'y',...y,u}:d?{k:'d',id:d,u}:null;if(m&&!seen[m.k+m.id]){seen[m.k+m.id]=1;o.push(m)}}return o}
const embed=m=>m.k==='y'?`<div class="mv" data-k="y" data-id="${m.id}" data-s="${m.s}" data-e="${m.e}"></div>`:`<div class="mv"><iframe src="https://drive.google.com/file/d/${m.id}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
const face=(s,cls)=>{const M=media(s),t=plain(s.h).trim(),io=(!s.h||M.some(m=>m.u===t))&&(s.img.length||M.length);
  return`<div class="face ${cls}"><div class="sc"><div class="in ${io?'io':''}"><div class="tx">${s.h}</div>${s.img.map(m=>`<div class="iw"><img src="${m.u}" draggable="false" alt=""></div>`).join('')}${M.map(embed).join('')}</div></div></div>`};
const FS=(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))?18:24;
function fit(f){
  const tx=f.querySelector('.tx');tx.style.fontSize=FS+'px';
  tx.classList.toggle('one',!tx.querySelector('br')&&tx.offsetHeight<=FS*1.7);
}
function resetZoom(){zs={z:1,x:0,y:0};$$('.card img,#fs img,.card .mv:not([data-k]) iframe').forEach(m=>{m.style.transform='';if(m.tagName==='IMG')m.style.touchAction='none'})}
function render(dir){
  clearInterval(tInt);killPlayers();resetZoom();flipped=false;
  const c=D[i],st=$('#stage'),old=st.querySelector('.slot'),slot=document.createElement('div');
  slot.className='slot';slot.innerHTML='<div class="card">'+face(c.f,'fr')+face(c.b,'bk')+'</div>';
  st.appendChild(slot);$$('.slot:last-child .face').forEach(fit);mountPlayers();focusGame();
  if(old&&dir){
    busy=true;const o={duration:380,easing:'cubic-bezier(.4,0,.2,1)'};
    old.animate([{transform:'translateY(0)'},{transform:`translateY(${dir>0?'-100%':'100%'})`}],o).onfinish=()=>old.remove();
    slot.animate([{transform:`translateY(${dir>0?'100%':'-100%'})`},{transform:'translateY(0)'}],o).onfinish=()=>busy=false;
  }else if(old)old.remove();
  const cn=$('#cnt');cn.textContent=(i+1)+' / '+D.length;cn.classList.remove('fl');void cn.offsetWidth;cn.classList.add('fl');
  if(c.s&&c.s!==lastSheet){const t=$('#ttl');t.textContent=c.s;t.classList.remove('on');void t.offsetWidth;t.classList.add('on')}
  lastSheet=c.s;
  const tm=$('#tm');tm.textContent='';
  if($('#tOn').checked){let t=+$('#tsel').value;tm.textContent=t;tInt=setInterval(()=>{tm.textContent=--t;if(t<=0){clearInterval(tInt);answer(false)}},1000)}
}
function flip(){const cd=$('.card:last-child')||$('.card');if(!cd||busy)return;flipped=!flipped;resetZoom();cd.classList.toggle('flip',flipped);mountPlayers()}
const curCard=()=>$$('.slot').pop().querySelector('.card');
function answer(ok){
  if(busy)return;busy=true;clearInterval(tInt);
  curCard().classList.add(ok?'gf':'rf');
  ok?wrong.delete(i):wrong.set(i,D[i]);
  setTimeout(()=>{busy=false;if(i>=D.length-1)finish();else{i++;render(1)}},420);
}
function undo(){if(busy||i===0)return;i--;render(-1)}
const act={W:()=>answer(false),R:()=>answer(true),U:undo,F:flip};
function press(k){const b=$(`#deck [data-k=${k}]`);b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),450);act[k]()}
$('#deck').onclick=e=>{const b=e.target.closest('.cb');if(b)press(b.dataset.k)};

function modal(h,btns){
  const m=$('#modal');m.querySelector('.box').innerHTML=h+'<div class="nav">'+btns.map((b,n)=>`<button class="btn ${b[2]||''}" data-n="${n}">${b[0]}</button>`).join('')+'</div>';
  m.classList.add('on');m.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>btns[el.dataset.n][1]());
}
const closeModal=()=>$('#modal').classList.remove('on');
function finish(){killPlayers();
  modal('<h2>Deck complete</h2><p>Do you want to download an Excel sheet for your wrong answers?</p>',
   [['No',()=>{closeModal();show('main')}],['Yes',async()=>{await exportWrong();closeModal();show('main')},'p']]);
}
async function exportWrong(){
  if(!wrong.size){alert('No cards were marked wrong.');return}
  const wb=new ExcelJS.Workbook(),sh={};
  for(const [,c] of [...wrong.entries()].sort((a,b)=>a[0]-b[0])){
    const n=(c.s||'PDF').slice(0,31).replace(/[\\\/?*\[\]:]/g,'_');let ws=sh[n];
    if(!ws){ws=sh[n]=wb.addWorksheet(n);ws.columns=[{width:50},{width:50}];ws._r=0}
    const r=++ws._r;let hh=24;
    [c.f,c.b].forEach((s,k)=>{
      const cell=ws.getCell(r,k+1);if(s.v!=null)cell.value=s.v;
      cell.style=Object.assign({},s.st,{alignment:{wrapText:true,vertical:'middle'}});
      s.img.forEach(m=>{
        const id=wb.addImage({base64:m.u,extension:m.u.includes('image/png')?'png':'jpeg'}),w=Math.min(m.w,300),h=m.w>300?m.h*300/m.w:m.h;
        ws.addImage(id,{tl:{col:k,row:r-1},ext:{width:w,height:h}});hh=Math.max(hh,h*.75+4);
      });
    });
    ws.getRow(r).height=hh;
  }
  const buf=await wb.xlsx.writeBuffer(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='wrong_'+fname+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('#gear').onclick=e=>{e.stopPropagation();$('#pop').classList.toggle('on')};
document.addEventListener('click',()=>$('#pop').classList.remove('on'));
$('#quit').onclick=()=>{clearInterval(tInt);killPlayers();if(fl)toggleFL();$('#stage').innerHTML='';show('main')};
$('#exp').onclick=exportWrong;

/* ---------- YouTube, focus, layout fullscreen ---------- */
const AP=new Map();let ytPr=null,ytIv=null,mt=0,fl=false;
const ytLoad=()=>ytPr||(ytPr=new Promise(r=>{if(window.YT&&YT.Player)return r();const o=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{o&&o();r()};const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=()=>{ytPr=null};document.head.appendChild(sc)}));
function killPlayers(){mt++;AP.forEach(r=>{try{r.p.destroy()}catch(e){}});AP.clear();clearInterval(ytIv);ytIv=null}
async function mountPlayers(){
  killPlayers();const tk=mt,mvs=$$('.slot:last-child .'+(flipped?'bk':'fr')+' .mv[data-k=y]');if(!mvs.length)return;
  await ytLoad();if(tk!==mt)return;
  mvs.forEach(mv=>{
    const id=mv.dataset.id,st=+mv.dataset.s,en=+mv.dataset.e,rec={s:st,e:en,seeked:!st};mv.innerHTML='<div></div>';
    rec.p=new YT.Player(mv.firstChild,{width:'100%',height:'100%',videoId:id,
      playerVars:Object.assign({rel:0,playsinline:1,modestbranding:1},st?{start:st}:{},en?{end:en}:{},location.protocol.startsWith('http')?{origin:location.origin}:{}),
      events:{onStateChange:ev=>{if(ev.data===1&&!rec.seeked){const p=ev.target;let ok=true;try{ok=p.getVideoData().video_id===id}catch(x){}
        if(ok){rec.seeked=true;if(p.getCurrentTime()<st-1)p.seekTo(st,true)}}}}});
    AP.set(mv,rec);
  });
  ytIv=setInterval(()=>AP.forEach(r=>{
    try{const p=r.p;if(!p.getCurrentTime)return;const t=p.getCurrentTime(),q=p.getPlayerState();
      if(r.e&&t>=r.e&&q===1){p.pauseVideo();p.seekTo(r.s,true)}else if(r.s&&r.seeked&&q===1&&t<r.s-1)p.seekTo(r.s,true)}catch(x){}}),500);
}
function ytKey(k){
  const r=[...AP.values()][0];if(!r||!r.p||typeof r.p.getPlayerState!=='function')return false;
  const p=r.p;if(k===' ')p.getPlayerState()===1?p.pauseVideo():p.playVideo();else p.seekTo(Math.max(0,p.getCurrentTime()+(k==='ArrowRight'?10:-10)),true);return true;
}
function ytFull(){const r=[...AP.values()][0];if(!r)return false;
  try{const f=r.p.getIframe();if(document.fullscreenElement===f)document.exitFullscreen();else(f.requestFullscreen||f.webkitRequestFullscreen).call(f)}catch(e){return false}return true}
function next(){if(busy||i>=D.length-1)return;i++;render(1)}
function toggleFL(){fl=!fl;$('#stage').classList.toggle('fsl',fl);const d=document;
  if(fl&&d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{});else if(!fl&&d.fullscreenElement)d.exitFullscreen().catch(()=>{})}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&fl){fl=false;$('#stage').classList.remove('fsl')}});
const gm=$('#game');gm.tabIndex=-1;
function focusGame(){try{gm.focus({preventScroll:true})}catch(e){}}
document.addEventListener('focusin',e=>{const b=e.target;if(b.matches&&b.matches('button')&&gm.contains(b)){b.blur();focusGame()}});
addEventListener('blur',()=>setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName==='IFRAME'&&gm.classList.contains('on')){a.blur();focusGame()}},0));

/* ---------- zoom / pan / fullscreen ---------- */
const fsOn=()=>$('#fs').classList.contains('on');
const tgt=()=>fsOn()?[$('#fs img')]:$$('.slot:last-child .'+(flipped?'bk':'fr')+' img,.slot:last-child .'+(flipped?'bk':'fr')+' .mv:not([data-k]) iframe');
function ap(){const T=tgt(),m=T[0];if(m){const mx=(zs.z-1)*m.offsetWidth/2,my=(zs.z-1)*m.offsetHeight/2;zs.x=Math.max(-mx,Math.min(mx,zs.x));zs.y=Math.max(-my,Math.min(my,zs.y))}T.forEach(m=>{m.style.transform=`translate(${zs.x}px,${zs.y}px) scale(${zs.z})`;if(m.tagName==='IMG')m.style.touchAction='none'})}
function zoomTo(z){zs.z=Math.min(5,Math.max(1,z));if(zs.z===1)zs.x=zs.y=0;ap()}
function zoom(d){zoomTo(zs.z+d)}
function pan(dx,dy){if(zs.z>1){zs.x+=dx;zs.y+=dy;ap()}}
function openFs(img){if(!img)return;const m=$('#fs img');m.src=img.src;resetZoom();$('#fs').classList.add('on')}
function closeFs(){$('#fs').classList.remove('on');resetZoom()}
$('#fx').onclick=closeFs;
$('#stage').addEventListener('dblclick',e=>{if(e.target.tagName==='IMG')openFs(e.target)});
$('#stage').addEventListener('click',e=>{if(e.target.tagName!=='IMG'&&!e.target.closest('.mv')){flip();focusGame()}});
const ptr=new Map();let pd=1,pz=1,fsTap=0;
const dist=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
document.addEventListener('pointerdown',e=>{
  if(e.target.tagName!=='IMG'||!e.target.closest('#fs,.card'))return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(ptr.size===2){pd=dist();pz=zs.z}
});
document.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  const px=o.x,py=o.y;o.x=e.clientX;o.y=e.clientY;
  if(ptr.size===2)zoomTo(pz*dist()/pd);
  else if(ptr.size===1&&zs.z>1)pan(o.x-px,o.y-py);
});
const pend=e=>{
  const o=ptr.get(e.pointerId);if(!o)return;ptr.delete(e.pointerId);
  if(e.type==='pointerup'&&fsOn()&&ptr.size===0&&Math.hypot(e.clientX-o.sx,e.clientY-o.sy)<10){
    const n=Date.now();if(n-fsTap<320){zoomTo(zs.z>1?1:2.5);fsTap=0}else fsTap=n;
  }
};
document.addEventListener('pointerup',pend);document.addEventListener('pointercancel',pend);
document.addEventListener('gesturestart',e=>e.preventDefault());
$('#fs').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.25:-.25)},{passive:false});

/* ---------- touch swipe ---------- */
let t0=null,raf;const stg=$('#stage');
const visSc=()=>$$('.slot:last-child .'+(flipped?'bk':'fr')+' .sc')[0];
stg.addEventListener('touchstart',e=>{cancelAnimationFrame(raf);const c=e.touches[0];t0=e.touches.length===1?{x:c.clientX,y:c.clientY,ly:c.clientY,lt:Date.now(),v:0,m:'',g:e.target}:null},{passive:true});
stg.addEventListener('touchmove',e=>{
  if(!t0)return;const c=e.touches[0],dx=c.clientX-t0.x,dy=c.clientY-t0.y;
  if(!t0.m&&(Math.abs(dx)>8||Math.abs(dy)>8))t0.m=Math.abs(dy)>Math.abs(dx)?'v':'h';
  if(t0.m==='v'&&!(t0.g.tagName==='IMG'&&zs.z>1)){
    const sc=visSc();if(!sc)return;const n=Date.now(),d=c.clientY-t0.ly;
    sc.scrollTop-=d;t0.v=d/Math.max(1,n-t0.lt);t0.ly=c.clientY;t0.lt=n;
  }
},{passive:true});
stg.addEventListener('touchend',e=>{
  if(!t0)return;const c=e.changedTouches[0],dx=c.clientX-t0.x,dy=c.clientY-t0.y,g=t0.g,T=t0;t0=null;
  if(g.tagName==='IMG'&&zs.z>1)return;
  if(T.m==='v'){
    const sc=visSc();let v=Date.now()-T.lt<80?T.v*16:0;
    const step=()=>{if(!sc||Math.abs(v)<.5)return;sc.scrollTop-=v;v*=.95;raf=requestAnimationFrame(step)};step();
    return;
  }
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){press(dx>0?'W':'R');return}
  if(g.tagName==='IMG'&&Math.abs(dx)<10&&Math.abs(dy)<10){const n=Date.now();if(n-lastTap<320){openFs(g);lastTap=0}else lastTap=n}
},{passive:true});

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  const k=e.key,g=$('#game').classList.contains('on');
  if(k==='Escape'){
    if(fsOn())closeFs();else if(fl)toggleFL();else if(zs.z>1)zoomTo(1);else if(flipped&&g&&!$('#modal').classList.contains('on'))flip();
    return;
  }
  if(!g||$('#modal').classList.contains('on')||(document.activeElement&&document.activeElement.tagName==='SELECT'))return;
  if(k==='+'||k==='='||k==='-'||k==='_'){e.preventDefault();zoom(k==='+'||k==='='?.25:-.25);return}
  if((e.altKey||e.metaKey)&&k.startsWith('Arrow')){e.preventDefault();pan(k==='ArrowRight'?40:k==='ArrowLeft'?-40:0,k==='ArrowDown'?40:k==='ArrowUp'?-40:0);return}
  if(e.ctrlKey&&k.startsWith('Arrow')){
    e.preventDefault();
    if(k==='ArrowUp'||k==='ArrowDown'){const sc=visSc();sc&&sc.scrollBy({top:k==='ArrowUp'?-90:90,behavior:'smooth'})}
    return;
  }
  if(e.ctrlKey||e.metaKey||fsOn())return;
  if(!e.shiftKey&&!e.altKey&&(k==='f'||k==='F')){e.preventDefault();ytFull();return}
  if(e.shiftKey&&(k==='F'||k==='f')){e.preventDefault();toggleFL();return}
  if(k==='ArrowUp'){e.preventDefault();undo();return}
  if(k==='ArrowDown'){e.preventDefault();next();return}
  if((k===' '||k==='ArrowLeft'||k==='ArrowRight')&&AP.size&&ytKey(k)){e.preventDefault();return}
  if(k==='ArrowRight'){e.preventDefault();press('R')}
  else if(k==='ArrowLeft'){e.preventDefault();press('W')}
  else if(e.code==='ShiftRight')press('U');
  else if(k==='Enter'){e.preventDefault();press('F')}
  else if(k===' '){e.preventDefault();openFs(tgt()[0])}
});

/* ---------- How to play ---------- */
const STEPS=[
 ['Welcome','Import an Excel sheet (.xlsx) or a highlighted PDF. Excel: column A is the front, column B the back, on every sheet. PDF: pink highlight = front, yellow highlight = back. YouTube and Google Drive links in cells become embedded players and previews.'],
 ['Answer cards','Swipe right-to-left or press the Right Arrow for a correct answer (green). Swipe left-to-right or press the Left Arrow for a wrong answer (red).'],
 ['Flip, undo, navigate','Tap the card or press Enter to flip. Undo button or Right Shift goes back. Up / Down arrows jump to the previous / next card without answering. Shift+F toggles card fullscreen, F makes a YouTube video fullscreen; Esc steps back (fullscreen, zoom, then flip to front).'],
 ['Text, images and videos','Scroll text with your finger, mouse wheel or Ctrl+Up/Down. Pinch to zoom images and drag to move (or + / − and Alt+arrows); Space or double-tap opens an image fullscreen. YouTube links play in the card: Space plays/pauses, Left/Right seek 10 s.'],
 ['Try the symbols','Tap each circle to see what it does.']];
function tour(n){
  const [t,d]=STEPS[n],last=n===STEPS.length-1;
  modal(`<h2>${t}</h2><p>${d}</p>`+(last?`<div class="demo">${ORDER.map(k=>btnHTML(k)).join('')}</div><p id="dd" style="text-align:center;min-height:48px">&nbsp;</p>`:''),
   [['Skip',closeModal],...(n?[['Back',()=>tour(n-1)]]:[]),[last?'Done':'Next',()=>last?closeModal():tour(n+1),'p']]);
  if(last)$$('.demo .cb').forEach(b=>b.onclick=()=>{b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),450);
    $('#dd').textContent={W:'Red: marks the card wrong. Swipe left→right or press ←.',R:'Green: marks the card right. Swipe right→left or press →.',U:'Undo: previous card. Press Right Shift.',F:'Flip: shows the other side. Tap the card or press Enter.'}[b.dataset.k]});
}
$('#how').onclick=()=>tour(0);
